name: CI/CD Pipeline de Infraestrutura - IIS

on:
  workflow_dispatch:
    inputs:
      nome_site:
        description: 'Nome do Site no IIS (Ex: Remaza (Adesao))'
        required: true
        type: string
      nome_apppool:
        description: 'Nome do App Pool (Ex: App_Remaza_Adesao)'
        required: true
        type: string
      caminho_fisico:
        description: 'Caminho Físico (Ex: D:\Remaza-Adesao)'
        required: true
        type: string
      versao_dotnet:
        description: 'Versão do .NET CLR'
        required: true
        type: choice
        options:
          - 'v4.0'
          - 'v2.0'
          - 'No Managed Code'
      modo_pipeline:
        description: 'Modo do Pipeline'
        required: true
        type: choice
        options:
          - 'Integrated'
          - 'Classic'
      identidade_pool:
        description: 'Conta de Serviço do App Pool'
        required: true
        type: choice
        options:
          - 'REMAZAWEB\WebTrusted'
          - 'ApplicationPoolIdentity'
      host_name:
        description: 'Domínio/URL (Ex: devadesao.remaza.com.br)'
        required: true
        type: string
      protocolo:
        description: 'Protocolo e Bindings'
        required: true
        type: choice
        options:
          - 'HTTP (Porta 80)'
          - 'HTTPS com Certificado (Porta 443)'

jobs:
  provision-infrastructure:
    runs-on: self-hosted
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Executar Provisionamento do IIS
        shell: powershell
        run: |
          .\scripts\Provision-IIS.ps1 `
            -SiteName "${{ inputs.nome_site }}" `
            -AppPoolName "${{ inputs.nome_apppool }}" `
            -PhysicalPath "${{ inputs.caminho_fisico }}" `
            -DotNetVersion "${{ inputs.versao_dotnet }}" `
            -PipelineMode "${{ inputs.modo_pipeline }}" `
            -AppPoolIdentity "${{ inputs.identidade_pool }}" `
            -HostName "${{ inputs.host_name }}" `
            -Protocol "${{ inputs.protocolo }}"