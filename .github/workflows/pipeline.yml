name: CI/CD Pipeline de Infraestrutura - IIS

on:
  push:
    branches: [ main ]

jobs:
  provision-infrastructure:
    runs-on: self-hosted

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Executar Provisionamento do IIS no Servidor (IaC)
      shell: powershell
      run: |
        & .\scripts\Provision-IIS.ps1 -SiteName "PortalArtemys" -Port 8000 -PhysicalPath "C:\inetpub\wwwroot\PortalArtemys"