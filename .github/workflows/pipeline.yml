name: CI/CD Pipeline de Infraestrutura - IIS

on:
  workflow_dispatch:
    inputs:
      site_name:
        description: 'Nome do Site e AppPool'
        required: true
        default: 'SiteTeste02'
      port:
        description: 'Porta do IIS'
        required: true
        default: '8001'
      physical_path:
        description: 'Caminho Físico no Servidor'
        required: true
        default: 'C:\inetpub\wwwroot\SiteTeste02'

jobs:
  provision-infrastructure:
    runs-on: self-hosted

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Executar Provisionamento Dinâmico no IIS
      shell: powershell
      run: |
        & .\scripts\Provision-IIS.ps1 -SiteName "${{ github.event.inputs.site_name }}" -Port ${{ github.event.inputs.port }} -PhysicalPath "${{ github.event.inputs.physical_path }}"